name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências com lockfile congelado
        run: pnpm install --frozen-lockfile
      - name: Build, lint, tipagem e testes
        run: pnpm check
