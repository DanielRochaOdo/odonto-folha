name: Gerar lockfile temporário para implementação

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/package.json'
      - 'packages/database/package.json'

permissions:
  contents: read

jobs:
  gerar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Gerar lockfile sem conectar banco ou executar scripts
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          echo LOCKFILE_INICIO
          base64 -w0 pnpm-lock.yaml | fold -w 3000 | sed 's/^/LOCKFILE_CHUNK:/'
          echo LOCKFILE_FIM
